<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Advanced Bacteria Simulation</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <h1>Bacteria Simulation with Realistic Temperature & Antibiotics</h1>

  <div class="controls">
    <!-- Температура -->
    <label>Temperature (°C):
      <input type="range" id="tempSlider" min="-10" max="60" value="25" step="1">
      <span id="tempValue">25</span>
    </label>

    <!-- Сила антибиотика -->
    <label>Antibiotic Strength:
      <input type="range" id="abSlider" min="0" max="2" value="1" step="0.1">
      <span id="abValue">1.0</span>
    </label>

    <!-- Выбор вида -->
    <label>Species:
      <select id="speciesSelect">
        <option value="Coccus">Coccus</option>
        <option value="Rod">Rod</option>
        <option value="Spirillum">Spirillum</option>
      </select>
    </label>

    <!-- Кнопка добавления -->
    <button id="addBacteriumBtn">Add Bacterium (Center)</button>

    <!-- Антибиотик (применим в центре) -->
    <button id="antibioticBtn">Antibiotic (Center, r=80)</button>
  </div>

  <div class="timer">
    Simulation Time: <span id="timerValue">0</span> s
  </div>

  <canvas id="petriCanvas" width="600" height="600"></canvas>
  <p>Click on canvas to add a chosen bacterium at clicked position.</p>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
